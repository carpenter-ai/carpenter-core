name: reflection
description: Reflection — analyse completed work (a daily batch, or specific arcs) and distil lessons to KB
capabilities:
  - system.read
  - kb.write
# Reflection is driven by a daily cadence, NOT a per-arc-completion trigger.
# A cron emits ``reflection.daily_tick`` (registered in __init__.py); the
# handler batches the arcs completed since the last tick into ``period``
# reflections. This replaces the old ``arc.status_changed`` trigger, whose
# create-on-every-completion semantics could form an unbounded feedback
# loop (a reflection's actions wrote skills/, spawning a skill-kb-review
# root arc, whose completion re-triggered a reflection, ...). A cadence
# that runs once/day over a bounded batch cannot loop.
steps:
  - name: gather-activity
    description: Build the gathered-activity contract for the reflect step
    role: prepare
    order: 0
    output_contract: data_models.reflection:GatheredActivity
  - name: reflect
    description: Analyse the gathered activity and emit a ReflectionResult
    role: analyze
    order: 1
    agent_type: EXECUTOR
    agent_model: haiku
    input_contract: data_models.reflection:GatheredActivity
    output_contract: data_models.reflection:ReflectionResult
    # Render the reflect step's agent goal at dispatch time from the
    # ``GatheredActivity`` produced by the preceding ``prepare`` sibling.
    # The platform's dispatch handler reads the sibling output, renders
    # ``reflect-goal.md`` against ``GatheredActivity.content``, and uses
    # the rendered string as the agent's goal — replacing the obsolete
    # SQL UPDATE on the sibling arc's goal column.
    goal_template: reflect-goal
    goal_template_subdir: reflections
    goal_input_sibling_role: prepare
    goal_input_output_name: gathered_activity
    goal_input_field: content
  - name: save-reflection
    description: Persist the reflection summary to KB
    role: persist
    order: 2
    input_contract: data_models.reflection:ReflectionResult
  - name: dispatch-actions
    description: Fan out proposed actions from the reflect step into child action arcs
    role: dispatch
    order: 3
    input_contract: data_models.reflection:ReflectionResult
