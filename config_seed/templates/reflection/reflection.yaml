name: reflection
description: Reflection — analyse completed work (a daily batch, or specific arcs) and distil lessons to KB
capabilities:
  - system.read
  - kb.write
# Reflection is driven by a daily cadence, NOT a per-arc-completion trigger.
# A cron emits ``reflection.daily_tick`` (registered in __init__.py); the
# handler batches the arcs completed since the last tick into ``period``
# reflections. This replaces the old ``arc.status_changed`` trigger, whose
# create-on-every-completion semantics could form an unbounded feedback
# loop (a reflection's actions wrote skills/, spawning a skill-kb-review
# root arc, whose completion re-triggered a reflection, ...). A cadence
# that runs once/day over a bounded batch cannot loop.
steps:
  - name: gather-activity
    description: Build the reflect step's goal from the subject's arc trajectories
    role: prepare
    order: 0
  - name: reflect
    description: Analyse the completed arc and produce actionable reflection
    role: analyze
    order: 1
    agent_type: EXECUTOR
    agent_model: haiku
  - name: save-reflection
    description: Persist the reflection to KB and run post-processing
    role: persist
    order: 2
  - name: dispatch-actions
    description: Fan out proposed actions from the reflect step into child action arcs
    role: dispatch
    order: 3
