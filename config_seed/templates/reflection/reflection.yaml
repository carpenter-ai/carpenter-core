name: reflection
description: Per-arc reflection — analyse a completed root arc and distill lessons to KB
capabilities:
  - system.read
  - kb.write
triggers:
  - name: on-root-arc-completed
    on: arc.status_changed
    filter:
      is_root: true
      new_status: completed
      # Don't reflect on the reflection pipeline's own byproduct arcs.
      # Excluding ``reflection`` alone (the old ``$ne: reflection``) left
      # a loop: a reflection's actions write to skills/, which spawns a
      # ``skill-kb-review`` root arc; when it completed it re-triggered a
      # reflection, whose actions wrote skills/ again, and so on — an
      # unbounded amplification loop that burned API credits. Excluding
      # both meta-templates breaks the cycle while still reflecting on
      # genuine user work (non-template arcs *and* task templates like
      # coding-change, which have a template_name not in this list).
      template_name:
        $nin: [reflection, skill-kb-review]
    action:
      type: create_arc
      template_name: reflection
      arc_name: reflection
      priority: 1000
      initial_arc_state:
        reflected_arc_id: "{event.payload.arc_id}"
steps:
  - name: gather-activity
    description: Build the reflect step's goal from the reflected arc's trajectory
    role: prepare
    order: 0
  - name: reflect
    description: Analyse the completed arc and produce actionable reflection
    role: analyze
    order: 1
    agent_type: EXECUTOR
    agent_model: haiku
  - name: save-reflection
    description: Persist the reflection to KB and run post-processing
    role: persist
    order: 2
  - name: dispatch-actions
    description: Fan out proposed actions from the reflect step into child action arcs
    role: dispatch
    order: 3
