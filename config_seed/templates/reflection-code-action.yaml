name: reflection-code-action
description: Execute a single reflection-proposed code action. Spawned by the reflection template's dispatch-actions step. The parent arc's goal is the fully-rendered action prompt.
capabilities:
  - code.write
steps:
  - name: execute-action
    description: Implement the code change described in the parent arc's goal
    order: 0
    agent_type: EXECUTOR
    agent_model: sonnet
