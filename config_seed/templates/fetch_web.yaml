name: fetch_web
description: |
  Fetch a URL in a sandboxed untrusted EXECUTOR; extract relevant content
  in a trusted REVIEWER; finalise in a trusted JUDGE.

  Runtime callers (currently ``invocation._handle_fetch_web_content``)
  instantiate this template with bindings={"goal": <user goal>} so the
  REVIEWER step knows what information to extract from the fetched page.
  The URL itself is passed via arc_state['fetch_url'] on the EXECUTOR
  arc, not through the template — templates do not see runtime values.
steps:
  - name: Fetch web content
    description: |
      Submit this EXACT code via submit_code (do not modify it):
      ```python
      from carpenter_tools.declarations import Label
      url_result = dispatch(Label("state.get"), {"key": Label("fetch_url")})
      url = url_result[Label("value")]
      result = dispatch(Label("web.fetch_webpage"), {"url": url})
      dispatch(Label("state.set"), {"key": Label("fetched_content"), "value": result})
      ```
      The URL has been pre-set in arc state as 'fetch_url'.
    integrity_level: untrusted
    output_type: json
    agent_type: EXECUTOR
    order: 0
  - name: Review fetched content
    description: |
      Read the untrusted output from the fetch arc. Extract the relevant
      information the user wanted: $goal. Store a clean summary in arc
      state under key '_agent_response'.
    agent_type: REVIEWER
    integrity_level: trusted
    reviewer_profile: security-reviewer
    model_policy: fast-chat
    order: 1
  - name: Validate review
    description: |
      Validate that the reviewer's extraction is accurate and complete.
      Copy the final answer to arc state key '_agent_response'.
    agent_type: JUDGE
    integrity_level: trusted
    reviewer_profile: judge
    order: 2
