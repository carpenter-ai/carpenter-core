# Extra credentials -- copied to {base_dir}/config/credential_registry.yaml on
# first run and never overwritten afterwards.
#
# RULE: tokens and secrets belong in {base_dir}/.env or the environment, NOT
# in config.yaml (.env is chmod 600 and never shared).
#
# Where a credential is declared:
#   * Every credential that Carpenter's own code reads (UI_TOKEN,
#     ANTHROPIC_API_KEY, GIT_TOKEN, SIGNAL_WEBHOOK_SECRET, TELEGRAM_BOT_TOKEN,
#     ...) is declared in carpenter/config.py (_CREDENTIAL_MAP).  It is not
#     listed here: this file is copied only once, so a credential added in a
#     later release would never reach an existing install through it.
#   * This file is for credentials Carpenter does not know about -- your own
#     or an integration's.  Each entry maps an env var name to the config key
#     it populates; the loader merges these over the built-in map.
#
# Example:
#
# MY_SERVICE_TOKEN:
#   config_key: my_service_token
#   description: "Token for my_service"
